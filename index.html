<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MINI-VALO 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; user-select: none; }
    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 14px; height: 14px;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 4px #00ffcc;
    }
    #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
    #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }
    
    #hud {
      position: fixed; bottom: 25px; left: 25px; color: white; font-size: 18px; font-weight: bold;
      background: rgba(15, 25, 35, 0.8); padding: 14px 24px; border-left: 4px solid #ff4655;
      letter-spacing: 1px;
    }
    #killfeed {
      position: fixed; top: 20px; right: 25px; color: #00ffcc; font-size: 16px; font-weight: bold;
      text-align: right; pointer-events: none;
    }
    #overlay {
      position: fixed; inset: 0; background: rgba(15, 25, 35, 0.9); color: white;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20;
    }
    h1 { color: #ff4655; font-size: 52px; margin: 0 0 10px 0; letter-spacing: 4px; }
    .settings-box {
      background: rgba(255, 255, 255, 0.08); padding: 20px 30px; border-radius: 8px;
      margin: 20px 0; border: 1px solid rgba(255, 255, 255, 0.15); text-align: center;
    }
    .settings-box label { display: block; margin-bottom: 10px; font-size: 16px; color: #ece8e1; }
    input[type="range"] { width: 220px; accent-color: #ff4655; cursor: pointer; }
    #startBtn {
      background: #ff4655; color: white; border: none; padding: 14px 40px;
      font-size: 20px; font-weight: bold; cursor: pointer; letter-spacing: 2px;
      transition: background 0.2s;
    }
    #startBtn:hover { background: #ff2a3c; }
    .controls-hint { color: #aaa; font-size: 14px; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>MINI-VALO</h1>
    <p id="menuSubtitle">훈련장 모드 (ESC를 눌러 언제든 설정 열기)</p>
    
    <div class="settings-box">
      <label for="sensSlider">마우스 감도: <span id="sensValue" style="color:#00ffcc; font-weight:bold;">1.00</span></label>
      <input type="range" id="sensSlider" min="0.1" max="3.0" step="0.05" value="1.0">
    </div>

    <button id="startBtn">게임 시작 / 계속하기</button>
    <p class="controls-hint">WASD: 이동 | SPACE: 점프 | E: 제트 대시 | 좌클릭: 사격 (머리 명중 시 헤드샷!) | ESC: 설정</p>
  </div>

  <div id="crosshair"></div>
  <div id="killfeed"></div>
  <div id="hud">
    점수: <span id="score">0</span> | 대시(E): <span id="dashStatus" style="color:#00ffcc;">준비완료</span>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    // === 사운드 효과 엔진 (Web Audio API) ===
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playGunshot() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;

      // 타격감 있는 저음 펀치
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);

      // 총성 파열 노이즈
      const bufferSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1200;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.5, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);
      noise.start(now);
    }

    function playKillSound(isHeadshot) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(isHeadshot ? 880 : 520, now);
      osc.frequency.exponentialRampToValueAtTime(isHeadshot ? 1320 : 660, now + 0.18);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    function playDashSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(650, now + 0.15);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    // === 3D 씬 & 카메라 세팅 ===
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a242f);
    scene.fog = new THREE.Fog(0x1a242f, 15, 90);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1.8);
    light.position.set(15, 25, 15);
    scene.add(light, new THREE.AmbientLight(0x506070, 2.2));

    // 훈련장 바닥
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(100, 100),
      new THREE.MeshStandardMaterial({ color: 0x2c3e50 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(100, 50, 0xff4655, 0x34495e));

    // 총기 모델 (밴달 스타일)
    const gunGroup = new THREE.Group();
    const gunBody = new THREE.Mesh(
      new THREE.BoxGeometry(0.1, 0.14, 0.65),
      new THREE.MeshStandardMaterial({ color: 0x181818, metalness: 0.6, roughness: 0.3 })
    );
    const gunAccent = new THREE.Mesh(
      new THREE.BoxGeometry(0.105, 0.04, 0.4),
      new THREE.MeshStandardMaterial({ color: 0xff4655 })
    );
    gunAccent.position.set(0, 0.03, -0.05);
    gunGroup.add(gunBody, gunAccent);
    gunGroup.position.set(0.32, -0.26, -0.5);
    camera.add(gunGroup);
    scene.add(camera);

    // === 훈련장 로봇(Bot) 생성 함수 ===
    const botHitboxes = [];
    const bots = [];

    function createTrainingBot() {
      const botGroup = new THREE.Group();

      const armorMat = new THREE.MeshStandardMaterial({ color: 0xd93848, metalness: 0.4, roughness: 0.4 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x222831, metalness: 0.7, roughness: 0.3 });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

      // 다리/하체 기둥
      const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.85, 12), darkMat);
      legs.position.y = 0.425;

      // 몸통
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.95, 0.48), armorMat);
      torso.position.y = 1.3;
      torso.userData = { botRoot: botGroup, isHead: false };

      // 왼팔 / 오른팔
      const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.24), darkMat);
      leftArm.position.set(-0.58, 1.3, 0);
      const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.24), darkMat);
      rightArm.position.set(0.58, 1.3, 0);

      // 머리 (헤드샷 판정용)
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.46, 0.46), armorMat);
      head.position.y = 2.08;
      head.userData = { botRoot: botGroup, isHead: true };

      // 로봇 바이저(눈)
      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.12, 0.05), eyeMat);
      visor.position.set(0, 2.08, 0.24);

      botGroup.add(legs, torso, leftArm, rightArm, head, visor);
      respawnBot(botGroup);
      scene.add(botGroup);

      bots.push(botGroup);
      botHitboxes.push(torso, head);
    }

    function respawnBot(bot) {
      bot.position.set((Math.random() - 0.5) * 44, 0, (Math.random() - 0.5) * 40 - 8);
      bot.lookAt(camera.position.x, 0, camera.position.z);
    }

    for (let i = 0; i < 8; i++) createTrainingBot();

    // === 조작 및 ESC 설정 ===
    const keys = {};
    let yaw = 0, pitch = 0, velY = 0, isGrounded = true;
    let dashCooldown = 0, dashTime = 0;
    let score = 0;
    let sensitivity = 1.0;

    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');

    sensSlider.addEventListener('input', (e) => {
      sensitivity = parseFloat(e.target.value);
      sensValue.innerText = sensitivity.toFixed(2);
    });

    startBtn.addEventListener('click', () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      const locked = document.pointerLockElement === document.body;
      overlay.style.display = locked ? 'none' : 'flex';
      if (!locked) {
        document.getElementById('menuSubtitle').innerText = '일시정지 및 설정 (ESC)';
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== document.body) return;
      const factor = 0.002 * sensitivity;
      yaw -= e.movementX * factor;
      pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch - e.movementY * factor));
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && isGrounded) { velY = 0.22; isGrounded = false; }
      if (e.code === 'KeyE' && dashCooldown <= 0 && document.pointerLockElement === document.body) {
        dashTime = 0.15;
        dashCooldown = 3.0;
        playDashSound();
      }
    });
    document.addEventListener('keyup', (e) => keys[e.code] = false);

    // 사격 판정
    const raycaster = new THREE.Raycaster();
    const killfeed = document.getElementById('killfeed');
    let killTimer = null;

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || document.pointerLockElement !== document.body) return;
      
      playGunshot();
      gunGroup.position.z = -0.34;
      gunGroup.rotation.x = 0.08;

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(botHitboxes);
      if (hits.length > 0) {
        const hitObj = hits[0].object;
        const isHead = hitObj.userData.isHead;
        const botRoot = hitObj.userData.botRoot;

        score += isHead ? 200 : 100;
        document.getElementById('score').innerText = score;
        playKillSound(isHead);

        killfeed.innerText = isHead ? '🎯 HEADSHOT! (+200)' : '💥 훈련봇 처치 (+100)';
        killfeed.style.color = isHead ? '#ff4655' : '#00ffcc';
        clearTimeout(killTimer);
        killTimer = setTimeout(() => { killfeed.innerText = ''; }, 1500);

        respawnBot(botRoot);
      }
    });

    // 게임 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (dashCooldown > 0) dashCooldown -= dt;
      const dashEl = document.getElementById('dashStatus');
      dashEl.innerText = dashCooldown > 0 ? dashCooldown.toFixed(1) + '초' : '준비완료';
      dashEl.style.color = dashCooldown > 0 ? '#ff4655' : '#00ffcc';

      let speed = 10;
      if (dashTime > 0) {
        dashTime -= dt;
        speed = 38;
        camera.fov = THREE.MathUtils.lerp(camera.fov, 95, 0.3);
      } else {
        camera.fov = THREE.MathUtils.lerp(camera.fov, 75, 0.2);
      }
      camera.updateProjectionMatrix();

      if (document.pointerLockElement === document.body) {
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const move = new THREE.Vector3();
        if (keys['KeyW']) move.add(forward);
        if (keys['KeyS']) move.sub(forward);
        if (keys['KeyD']) move.add(right);
        if (keys['KeyA']) move.sub(right);
        if (move.length() > 0) move.normalize();
        camera.position.addScaledVector(move, speed * dt);
      }

      velY -= 0.012;
      camera.position.y += velY;
      if (camera.position.y <= 2) { camera.position.y = 2; velY = 0; isGrounded = true; }

      // 총기 반동 복귀
      gunGroup.position.z = THREE.MathUtils.lerp(gunGroup.position.z, -0.5, 0.2);
      gunGroup.rotation.x = THREE.MathUtils.lerp(gunGroup.rotation.x, 0, 0.2);

      // 로봇들이 플레이어를 바라보도록 회전
      bots.forEach(bot => bot.lookAt(camera.position.x, 0, camera.position.z));

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
